[tools]
node = "24"
bun = "latest"
# Global default yarn for projects without a packageManager field. Projects that
# pin a version via package.json `packageManager` (e.g. yarn@4) override this
# per-project (see [settings] idiomatic_version_file_enable_tools below).
yarn = "1"
ruby = "3.2"
go = "latest"
uv = "latest"
age = "latest"
sops = "latest"
fnox = "latest"
# https://mise.jdx.dev/dev-tools/backends/gem.html
# cocoapods はここでバージョン固定して管理する。brew では入れない
# （`brew bundle dump --force` の差分に `brew "cocoapods"` が出ても Brewfile に追加しないこと）
"gem:cocoapods" = "1.16.2"
# https://github.com/perplexityai/bumblebee Check exposure to known software supply-chain compromises.
"go:github.com/perplexityai/bumblebee/cmd/bumblebee" = "v0.1.1"
java = "zulu-17"
sqlite = "3.53.3"
python = "3.14.6"

[settings]
experimental = true
# Read package.json `packageManager` / `devEngines.packageManager` and node's
# `.nvmrc` / `.node-version` as idiomatic version files, so mise resolves the
# project-pinned version per-project (the corepack replacement; node also auto-
# resolves idiomatically instead of being pinned only via [tools]).
# npm resolves via mise's registry to `aqua:npm/cli` (mise default since 2026-05,
# jdx/mise#9762): versions from npm/cli's GitHub tags, artifact from the npmjs.org tarball
# — so managing npm itself bypasses the FLATT registry/token (node still runs npm's JS).
# Pin `npm:npm` explicitly only if a project needs the old npm-installs-npm backend.
# See docs/fnox-token-management.md.
idiomatic_version_file_enable_tools = [
  "node",
  "deno",
  "pnpm",
  "yarn",
  "npm",
  "bun",
  "go",
  "java",
  "python",
  "ruby",
  "rust",
]

[env]
# Make XDG-aware tools (e.g. pnpm 11+ -> ~/.config/pnpm/config.yaml) use ~/.config
# instead of the macOS default ~/Library/Preferences. Set here (not per-shell) so
# fish/bash/zsh and mise shims all inherit it via mise activation. env-paths-based
# tools (astro, eas-cli, …) ignore XDG and stay in ~/Library.
XDG_CONFIG_HOME = "{{env.HOME}}/.config"
# `brew bundle dump` dumps go/cargo/uv/npm/… extension types by default (no type
# flag = all). The npm dumper runs `npm list -g`, which picks up corepack bundled
# with the mise-managed Node and writes a stray `npm "corepack"` to the Brewfile.
# Node tooling is mise-managed, so exclude only the npm type from dumps (go etc.
# are still wanted). Set here so it's inherited the same way as XDG_CONFIG_HOME.
HOMEBREW_BUNDLE_DUMP_NO_NPM = "1"
# Shell-agnostic PATH additions, so one entry reaches fish/zsh/bash alike.
# Not `fish_add_path`: it writes to the universal variable `fish_user_paths`
# (~/.config/fish/fish_variables, untracked), so the effective PATH drifts from
# what config.fish shows, and it never reaches processes not started from fish
# (an agent's zsh gets PATH only by inheritance, which depends on the launcher).
# Earlier entries win, and all of them land ahead of mise's own tool paths, so
# keep directories that would shadow a mise-managed tool out of this list
# (~/.bun/bin holds `bun install -g` output, not bun itself, so it is safe).
# Android/Go paths are spelled out rather than reusing $ANDROID_HOME / $GOPATH,
# which config.fish sets and therefore only fish sees.
_.path = [
  "{{env.HOME}}/dotfiles/bin",
  "{{env.HOME}}/.local/bin",
  # aqua's documented fallback form, verbatim — mise expands `${VAR:-default}`
  # (nesting included) in [env]. aqua wants its bin ahead of other version
  # managers, which holds here since _.path precedes mise's tool paths.
  "${AQUA_ROOT_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/aquaproj-aqua}/bin",
  "{{env.HOME}}/.orbstack/bin",
  "{{env.HOME}}/.bun/bin",
  # No ~/go/bin: mise points GOBIN at its own go install dir, and Go CLI tools
  # are managed through the `go:` backend in [tools] instead of `go install`.
  # Flipping `go.set_gobin = false` would send `go install` to ~/go/bin and make
  # this entry necessary again.
  "{{env.HOME}}/Library/Android/sdk/platform-tools",
  "{{env.HOME}}/Library/Android/sdk/emulator",
  # Ghostty.app/Contents/MacOS is deliberately absent: Ghostty puts it on PATH
  # itself, so listing it here only duplicated the entry.
  # Homebrew's bin/sbin are deliberately absent: `brew shellenv <shell>` supplies
  # them from each rc (it also exports HOMEBREW_PREFIX and friends, which this
  # cannot). It has to run before `mise activate`, or its `--move` pulls
  # /opt/homebrew/bin ahead of the mise-managed tools and brew's python3 wins.
]
